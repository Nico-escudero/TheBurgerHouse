<h1 class="adm-titulo">Ajustes</h1>
<p class="adm-sub">Datos del local</p>

<form class="adm-panel form" (submit)="guardar($event)" novalidate>
    <label class="adm-campo">
        <span>WhatsApp para pedidos</span>
        <input class="adm-input" type="tel" inputmode="numeric" autocomplete="off" placeholder="5492494606000"
            [value]="whatsapp()" (input)="whatsapp.set(texto($event))">
        <small>Con código de país y de área, sin el 0 ni el 15. Ej: 54 9 249 4606000 → 5492494606000</small>
    </label>

    <label class="adm-campo">
        <span>Dirección para retirar</span>
        <input class="adm-input" type="text" placeholder="Maipú 1712, Tandil" [value]="direccion()"
            (input)="direccion.set(texto($event))">
        <small>Se usa en el mensaje de WhatsApp cuando el cliente elige "Retiro".</small>
    </label>

    <h2 class="adm-panel__titulo">Datos para transferencias</h2>
    <p class="nota">Se muestran al cliente cuando elige pagar por transferencia. Los campos vacíos no se muestran.</p>

    <label class="adm-campo">
        <span>Alias</span>
        <input class="adm-input" type="text" autocomplete="off" placeholder="mi.alias.mp" [value]="alias()"
            (input)="alias.set(texto($event))">
    </label>

    <label class="adm-campo">
        <span>CBU / CVU</span>
        <input class="adm-input" type="text" inputmode="numeric" autocomplete="off" placeholder="22 números"
            [value]="cbu()" (input)="cbu.set(texto($event))">
    </label>

    <label class="adm-campo">
        <span>Titular de la cuenta</span>
        <input class="adm-input" type="text" autocomplete="off" placeholder="Nombre y apellido" [value]="titular()"
            (input)="titular.set(texto($event))">
    </label>

    <label class="adm-campo">
        <span>Banco o billetera</span>
        <input class="adm-input" type="text" autocomplete="off" placeholder="Mercado Pago, Galicia…"
            [value]="banco()" (input)="banco.set(texto($event))">
    </label>

    @if (mensaje(); as m) {
    <p [class]="m.ok ? 'ok' : 'adm-error'" role="status">{{ m.texto }}</p>
    }

    <button type="submit" class="adm-btn" [disabled]="guardando()">{{ guardando() ? 'Guardando…' : 'Guardar' }}</button>
</form>
