<!-- Esc dispara "cancel": se trata como "Cancelar" -->
<dialog #dialogo class="confirmar" aria-labelledby="confirmar-titulo" aria-describedby="confirmar-mensaje"
    (cancel)="$event.preventDefault(); responder(false)" (click)="clickFondo($event)">
    @if (servicio.actual(); as p) {
    <div class="confirmar__caja">
        <div class="confirmar__icono" [class.peligro]="p.peligro" aria-hidden="true">
            @if (p.peligro) {
            <!-- Bootstrap Icons: trash3 -->
            <svg width="26" height="26" viewBox="0 0 16 16" fill="currentColor">
                <path
                    d="M6.5 1h3a.5.5 0 0 1 .5.5v1H6v-1a.5.5 0 0 1 .5-.5M11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3A1.5 1.5 0 0 0 5 1.5v1H1.5a.5.5 0 0 0 0 1h.538l.853 10.66A2 2 0 0 0 4.885 16h6.23a2 2 0 0 0 1.994-1.84l.853-10.66h.538a.5.5 0 0 0 0-1zm1.958 1-.846 10.58a1 1 0 0 1-.997.92h-6.23a1 1 0 0 1-.997-.92L3.042 3.5zm-7.487 1a.5.5 0 0 1 .528.47l.5 8.5a.5.5 0 0 1-.998.06L5 5.03a.5.5 0 0 1 .47-.53Zm5.058 0a.5.5 0 0 1 .47.53l-.5 8.5a.5.5 0 1 1-.998-.06l.5-8.5a.5.5 0 0 1 .528-.47M8 4.5a.5.5 0 0 1 .5.5v8.5a.5.5 0 0 1-1 0V5a.5.5 0 0 1 .5-.5" />
            </svg>
            } @else {
            <span>!</span>
            }
        </div>

        <h2 id="confirmar-titulo" class="confirmar__titulo">{{ p.titulo }}</h2>
        @if (p.mensaje) {
        <p id="confirmar-mensaje" class="confirmar__mensaje">{{ p.mensaje }}</p>
        }
        @if (p.detalle) {
        <p class="confirmar__detalle">{{ p.detalle }}</p>
        }

        <div class="confirmar__acciones">
            <button #cancelarBtn type="button" class="adm-btn adm-btn--borde" (click)="responder(false)">
                {{ p.cancelar ?? 'Cancelar' }}
            </button>
            <button type="button" class="adm-btn" [class.confirmar__peligro]="p.peligro" (click)="responder(true)">
                {{ p.aceptar ?? 'Aceptar' }}
            </button>
        </div>
    </div>
    }
</dialog>
