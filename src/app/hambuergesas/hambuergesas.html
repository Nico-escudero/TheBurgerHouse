<div class="container-fluid">
    <div class="d-flex flex-row flex-wrap align-items-end">
        <span class="number">01</span>
        <h2 class="text-uppercase title">burgers</h2>
        <p class="options">15 opciones</p>
    </div>
    <section class="row g-4 mt-2">
        <div class="col-12 col-lg-6">
            <article class="producto">
                <div class="foto">
                    <img src="./img/hero.webp" class="img_object" alt="Meat & Cheese" width="124" height="124"
                        (error)="ocultarImagen($event)">
                </div>
                <div class="info">
                    <h3>Meat & Cheese</h3>
                    <p class="desc">Doble burger smasheada + x4 cheddar + salsa 'Mil-House'</p>
                    <p class="precio">$19.800 <span class="papas"><span class="guion">· </span>con papas $23.800</span>
                    </p>
                </div>
                <div class="contador">
                    <button type="button" class="btn-cant" aria-label="Restar">−</button>
                    <span class="cant">1</span>
                    <button type="button" class="btn-cant lleno" aria-label="Sumar">+</button>
                </div>
            </article>
        </div>
        <div class="col-12 col-lg-6">
            <article class="producto">
                <div class="foto">
                    <img src="./img/hero.webp" class="img_object" alt="Sweet Bacon" width="124" height="124"
                        (error)="ocultarImagen($event)">
                </div>
                <div class="info">
                    <h3>Sweet Bacon</h3>
                    <p class="desc">Doble burger smasheada + x4 cheddar + x3 bacon + cebolla caramelizada + salsa
                        'House'</p>
                    <p class="precio">$21.800 <span class="papas"><span class="guion">· </span>con papas $25.800</span>
                    </p>
                </div>
                <div class="contador">
                    <button type="button" class="btn-cant" aria-label="Restar">−</button>
                    <span class="cant">1</span>
                    <button type="button" class="btn-cant lleno" aria-label="Sumar">+</button>
                </div>
            </article>
        </div>


    </section>
</div>
