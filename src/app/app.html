<!-- En /admin el dashboard tiene su propio header: no se muestra nada del sitio público -->
@if (!enAdmin()) {
<header class="site-nav" #header>
    <div class="site-nav__inner">
        <!-- Logo de la marca: reemplazar por <img src="/img/logo.webp" alt="The Burger House"> -->
        <a class="site-nav__logo" routerLink="/" [fragment]="HERO" (click)="activo.set(HERO)"
            aria-label="The Burger House, ir al inicio">
            THE BURGER <span>HOUSE</span>
        </a>

        <nav class="site-nav__links" #linksBar aria-label="Secciones del menú">
            @for (link of links; track link.id) {
            <a class="site-nav__link" [attr.data-id]="link.id" [class.is-active]="activo() === link.id"
                [attr.aria-current]="activo() === link.id ? 'location' : null" routerLink="/" [fragment]="link.id"
                (click)="activo.set(link.id)">{{ link.label }}</a>
            }
        </nav>

        <button class="site-nav__cart" #cartBtn type="button" aria-label="Abrir carrito" (click)="carrito.abierto.set(true)">
            <!-- Bootstrap Icons: bag -->
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 16 16"
                aria-hidden="true">
                <path
                    d="M8 1a2.5 2.5 0 0 1 2.5 2.5V4h-5v-.5A2.5 2.5 0 0 1 8 1m3.5 3v-.5a3.5 3.5 0 1 0-7 0V4H1v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V4zM2 5h12v9a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z" />
            </svg>
            @if (cantidadCarrito() > 0) {
            <span class="site-nav__badge" #badge>{{ cantidadCarrito() }}</span>
            }
        </button>
    </div>
</header>
}

<router-outlet />

@if (!enAdmin()) {
<footer class="footer" #footer>
    <h2 class="footer__big">The Burger House</h2>
    <p>
        Maipú 1712, Tandil ·
        <a href="https://www.instagram.com/theburgerhouse.tandil" target="_blank">@theburgerhouse.tandil</a>
    </p>
</footer>

<!-- Paneles: carrito y ficha de producto (<dialog> modal) -->
<app-carrito />
<app-ficha />
}
