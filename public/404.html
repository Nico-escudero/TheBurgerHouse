<!doctype html>
<html lang="es-AR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Página no encontrada | The Burger House</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <!-- Página 404 estática (Vercel la sirve para cualquier URL que no existe). Sin dependencias de la app -->
  <style>
    @font-face { font-family: 'Archivo'; font-style: normal; font-weight: 900; font-display: swap; src: url(/fonts/archivo-latin.woff2) format('woff2'); }
    @font-face { font-family: 'Barlow Semi Condensed'; font-style: normal; font-weight: 600; font-display: swap; src: url(/fonts/barlow-semi-condensed-600-latin.woff2) format('woff2'); }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100svh;
      display: grid; place-items: center; padding: 24px; text-align: center;
      background-color: #0A0A0A;
      background-image:
        linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
      background-size: 30px 30px;
      color: #F5F5F5; font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 600;
    }
    svg { width: 96px; height: 96px; }
    h1 { margin: 18px 0 8px; font: 900 clamp(40px, 10vw, 88px)/.9 'Archivo', sans-serif; text-transform: uppercase; }
    h1 span { color: #F2B83B; }
    p { margin: 0 0 24px; font-size: 1.2rem; color: #D8D8D8; }
    a {
      display: inline-block; padding: .5rem 1.1rem; border-radius: 999px;
      background: #F2B83B; color: #111; text-decoration: none; font-size: 1.3rem;
    }
    a:focus-visible { outline: 3px solid #F5F5F5; outline-offset: 3px; }
  </style>
</head>

<body>
  <main>
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <path fill="#F2B83B"
        d="m94 50 2.6 6.1-4.1 5.3-4.6 4.3.2 6.3-.8 6.6-6.2 2.5-6.1 1.4-3 5.6-4 5.3-6.6-.9-6-1.9L50 94l-6.1 2.6-5.3-4.1-4.3-4.6-6.3.2-6.6-.8-2.5-6.2-1.4-6.1-5.6-3-5.3-4 .9-6.6 1.9-6L6 50l-2.6-6.1 4.1-5.3 4.6-4.3-.2-6.3.8-6.6 6.2-2.5 6.1-1.4 3-5.6 4-5.3 6.6.9 6 1.9L50 6l6.1-2.6 5.3 4.1 4.3 4.6 6.3-.2 6.6.8 2.5 6.2 1.4 6.1 5.6 3 5.3 4-.9 6.6-1.9 6Z" />
      <path fill="none" stroke="#111" stroke-linecap="round" stroke-width="5" d="M36 32v14m26-16v16M28 62c14-10 32-10 46 0" />

    <p>Esta página no existe. Las burgers están en el menú.</p>
    <a href="/">Ver el menú</a>

</html>
